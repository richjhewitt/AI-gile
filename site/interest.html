<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-gile: tell me when the alpha opens</title>
<meta name="description" content="Leave your email to hear when AI-gile's closed alpha or beta opens.">
<meta name="theme-color" content="#12151b">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="style.css">
<script>
try{var t=localStorage.getItem("aigile-site-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}
</script>
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="/"><img src="assets/icon.png" alt="" width="40" height="40">AI-gile</a>
</header>
<main id="main" class="form-page">
  <h1>🔔 Tell me when it opens</h1>
  <p class="lede">AI-gile is in closed pre-alpha. Leave your email and we'll write once, when there's a place for you.</p>
  <form data-post="/interest" data-thanks="Thanks! You're on the list.">
    <label>Your email<input name="email" type="email" required maxlength="160" autocomplete="email"></label>
    <fieldset><legend>Which test?</legend>
      <label class="pick"><input type="radio" name="which" value="alpha" checked> Closed alpha: early, rough, lots of changes</label>
      <label class="pick"><input type="radio" name="which" value="beta"> Beta: steadier, later</label>
      <label class="pick"><input type="radio" name="which" value="both"> Either, whichever comes first</label>
    </fieldset>
    <button type="submit" class="btn">Put me on the list</button>
    <p class="form-msg" role="status" aria-live="polite"></p>
  </form>
  <p class="muted">Only your email and the test you picked are kept, for this list only. No newsletter, no trackers.</p>
</main>
<footer><a href="/">← Back to AI-gile</a></footer>
</div>
<script src="forms.js"></script>
</body>
</html>
