<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="status.title">AI-gile status</title>
<script src="lang/languages.js"></script>
<script src="lang/en.js"></script>
<script src="i18n.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#677085;--line:#dde1e8}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#20262f;--text:#e6e9ef;--muted:#8b93a7;--line:#2a303c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 16px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.dot{font-size:20px;line-height:1.3}
.name{font-weight:600;overflow-wrap:anywhere}
.offers,.when{color:var(--muted);font-size:14px}
.line{margin-top:4px;overflow-wrap:anywhere}
.intro{color:var(--muted);margin:-8px 0 16px}
#msg{color:var(--muted);padding:20px 0;text-align:center;font-size:18px}
#quiet{color:var(--muted);padding:20px 0;text-align:center;font-size:18px}
.top{display:flex;justify-content:flex-end;margin:0 0 8px}
footer{margin-top:20px;font-size:14px;color:var(--muted)}
a{color:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="top"><span id="lang-slot"></span></div>
<h1 data-i18n="status.h1">AI-gile status</h1>
<p class="intro" data-i18n="status.intro">Is AI-gile working right now? This page checks the website, board sharing, calls and the download every 5 minutes.</p>
<ul id="list"></ul>
<p id="quiet" hidden data-i18n="status.quiet">All quiet</p>
<p id="msg" role="status">Checking…</p>
<footer><a href="index.html">AI-gile</a></footer>
</main>
<script>
(function(){
  var URL_="https://relay.aigile.lol/status.json",POLL_MS=60000,DOT={green:"\uD83D\uDFE2",amber:"\uD83D\uDFE0",red:"\uD83D\uDD34"};
  var list=document.getElementById("list"),quiet=document.getElementById("quiet"),msg=document.getElementById("msg");
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function ago(at){
    var t=Date.parse(at);if(isNaN(t))return "";
    var m=Math.max(0,Math.round((Date.now()-t)/60000));
    var t_=SiteI18n.t;
    return t_("status.updated",{ago:m<1?t_("status.justNow"):m<60?t_("status.min",{n:m}):m<1440?t_("status.hours",{n:Math.round(m/60)}):t_("status.days",{n:Math.round(m/1440)})});
  }
  var last=null,msgKey="status.checking";
  function draw(s){
    last=s;
    list.textContent="";msg.hidden=true;
    var a=(s&&Array.isArray(s.services))?s.services:[];
    quiet.hidden=a.length>0;
    a.forEach(function(x){
      var li=el("li",x.state),body=el("div");
      li.appendChild(el("span","dot",DOT[x.state]||DOT.green));
      // AIG-1284: the relay's own checks carry a key: name and offer in the page's language, and up / no answer / down
      var k=x.key?"status.svc."+String(x.key).replace(/[^a-z]/g,""):"",tk=function(s,f){var v=k&&SiteI18n.t(k+s);return v&&v!==k+s?v:f};
      body.appendChild(el("div","name",tk("",x.name)));
      var of=tk(".offers",x.offers);if(of)body.appendChild(el("div","offers",of));
      var ln=x.key?SiteI18n.t(x.state==="green"?"status.up":x.state==="amber"?"status.slow":"status.down",{ms:x.ms||0}):x.line;
      if(ln)body.appendChild(el("div","line",ln));
      body.appendChild(el("div","when",ago(x.at)));
      li.appendChild(body);list.appendChild(li);
    });
  }
  function poll(){
    fetch(URL_,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(draw).catch(function(){
      if(!list.children.length){quiet.hidden=true;msg.hidden=false;msgKey="status.offline";msg.textContent=SiteI18n.t(msgKey)}
    });
  }
  // A new language: redraw the "updated" lines and the message in it (AIG-1226).
  SiteI18n.on(function(){msg.textContent=SiteI18n.t(msgKey);if(last)draw(last)});
  poll();setInterval(poll,POLL_MS);
})();
</script>
</body>
</html>
