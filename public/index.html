<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-gile</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1><a href="#/" id="brand">🗂️ AI-gile</a></h1>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <span id="teamTop"></span>
  <span id="inboxTop"></span>
  <span id="pokeTop"></span>
  <span id="nightTop"></span>
  <a class="navlink" href="#/usage" data-i18n="nav.usage">⚡ Usage</a>
  <a class="navlink" href="#/setup" data-i18n-title="nav.setup.title" title="Your name and where the agent lives on this computer">⚙️</a>
  <button id="themeBtn" class="theme-pick" onclick="nextTheme()" title="Theme">🖥️ System</button>
  <button id="enBtn" class="theme-pick" hidden onclick="toggleEn()"></button>
  <span class="live" id="live" data-i18n="live.ok">live</span>
</header>
<div id="filterbar"></div>
<main id="app"></main>
<div id="modal"></div>
<div id="dialog"></div>
<nav id="dmRail" data-i18n-label="dms.rail.label" aria-label="DMs with your team leads"></nav>
<aside id="dmPanel" hidden></aside>
<div id="updateTop"><span id="upUpdate"></span><span id="upRefresh"></span><span id="upRestart"></span></div>

<!-- Classic scripts sharing one global scope; the order matters (see docs/CODEMAP.md). app.js starts everything and must stay last. -->
<script src="js/usage-page.js"></script>
<script src="js/inbox.js"></script>
<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/format.js"></script>
<script src="js/attach.js"></script>
<script src="js/filters.js"></script>
<script src="js/home.js"></script>
<script src="js/standup.js"></script>
<script src="js/board.js"></script>
<script src="js/card.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/dms.js"></script>
<script src="js/app.js"></script>
</body>
</html>
