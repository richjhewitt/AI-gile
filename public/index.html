<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-gile</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --col: #eef0f3; --text: #1d2330; --muted: #677085; --line: #dde1e8;
    --accent: #3b6cf6; --done: #1f9d61; --warn: #d97706; --danger: #dc2626; --you: #9333ea;
    --shadow: 0 1px 2px rgba(20,30,50,.08);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --col: #161a22; --text: #e6e9ef; --muted: #8b93a7; --line: #2a303c;
      --accent: #6d93ff; --done: #34c77b; --warn: #f0a33a; --danger: #f06262; --you: #b57cff;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; text-decoration: none; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; }
  header .crumb { color: var(--muted); }
  header .spacer { flex: 1; }
  .navlink { font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--col); }
  .navlink:hover { border-color: var(--accent); }
  a.usage { display: block; }
  a.usage:hover { border-color: var(--accent); }
  .live { font-size: 12px; color: var(--muted); }
  .live::before { content: "●"; color: var(--done); margin-right: 4px; }
  .live.off::before { color: var(--danger); }
  main { padding: 20px; }
  .muted { color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--col); color: var(--muted); white-space: nowrap; }
  .pill.you { background: var(--you); color: #fff; }
  .pill.blocked { background: var(--danger); color: #fff; }
  .pill.urgent { color: var(--danger); } .pill.high { color: var(--warn); }

  /* Portfolio */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .proj { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: block; }
  .proj:hover { border-color: var(--accent); }
  .proj h2 { font-size: 16px; margin: 0 0 2px; display: flex; gap: 8px; align-items: center; }
  .bar { height: 8px; border-radius: 99px; background: var(--col); overflow: hidden; display: flex; margin: 10px 0 6px; }
  .bar span { display: block; height: 100%; }
  .counts { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .last { margin-top: 8px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inbox { background: var(--panel); border: 1px solid var(--you); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 18px; }
  .inbox h3 { margin: 0 0 6px; font-size: 14px; color: var(--you); }
  .inbox li { margin: 3px 0; }

  /* Board */
  .board { display: grid; grid-template-columns: repeat(7, minmax(180px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .column { background: var(--col); border-radius: var(--radius); padding: 10px; min-height: 120px; }
  .column h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card.needs-you { border-left: 3px solid var(--you); }
  .column[data-status=verify] { outline: 2px dashed var(--you); outline-offset: -2px; }
  .column[data-status=team] { outline: 2px dashed #e11d74; outline-offset: -2px; }
  .flight { margin: 0 0 10px; font-size: 13px; }
  .stale { color: var(--warn); }
  .heard { font-size: 12px; color: var(--muted); margin: -2px 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.stale-card { border: 2px solid #f97316; background: color-mix(in srgb, #f97316 12%, var(--panel)); }
  .stale-card .heard { color: #c2410c; font-weight: 600; }
  .poke.hot { background: #f97316; color: #fff; border-color: #f97316; font-weight: 600; }
  .poke { margin-left: auto; padding: 0 8px; font-size: 12px; border-radius: 99px; }
  .usage { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 16px; margin-bottom: 14px; font-size: 13px; }
  .ctabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 12px; overflow-x: auto; }
  .ctab { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 12px; font-weight: 600; color: var(--muted); flex: none; }
  .ctab.on { color: var(--text); border-bottom-color: var(--accent); }
  .ctab .n { font-size: 11px; background: var(--col); border-radius: 99px; padding: 1px 6px; margin-left: 4px; color: var(--muted); }
  .ctab .n.hot { background: var(--you); color: #fff; }
  .comment.latest { background: var(--col); border-radius: 8px; padding: 10px 12px; border: 0; }
  .tag-latest { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-right: 8px; }
  .pres { font-weight: 600; } .pres.on { color: var(--done); } .pres.off { color: var(--muted); } .pres.wake { color: var(--warn); }
  #teamTop { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  #teamTop .muted { display: none; }
  #teamTop .primary { padding: 3px 10px; font-size: 13px; border-radius: 99px; }
  #teamTop .pres { padding: 3px 10px; border-radius: 99px; background: var(--col); }
  ul.bl { margin: 2px 0; padding-left: 20px; white-space: normal; }
  ul.bl li { margin: 0 0 8px; line-height: 1.5; }
  ul.bl li:last-child { margin-bottom: 0; }
  .codebox { position: relative; margin: 6px 0; white-space: normal; }
  .codebox pre { background: #1e2430; color: #e6e9ef; padding: 12px 14px; padding-right: 90px; border-radius: 8px; overflow-x: auto; margin: 0; white-space: pre; font-size: 13px; }
  .codebox pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
  .codebox .copy { position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 3px 8px; }
  .desc code, .body code, .ib-question code { background: var(--col); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
  #filterbar { padding: 12px 20px 0; }
  .fbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fbar input[type=search] { flex: 1 1 220px; max-width: 360px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; }
  #f-sel { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .fbar select { width: auto; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; margin-right: 4px; }
  .seen { font-size: 12px; margin-left: 6px; color: var(--muted); }
  .card.is-blocked { border-left: 3px solid var(--danger); }
  .card .id { font-size: 11px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .card .t { margin: 2px 0 6px; font-weight: 500; }
  .card .meta { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .side { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
  .box h3 { margin: 0 0 8px; font-size: 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .log { list-style: none; padding: 0; margin: 0; max-height: 320px; overflow: auto; font-size: 13px; }
  .log li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .log li.decision { border-left: 3px solid var(--warn); padding-left: 8px; }

  /* Card detail panel */
  /* Card panel: a roomy centred sheet on desktop; full screen on phones (see the 760px block below). */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; justify-content: center; align-items: flex-start; padding: 4vh 16px; z-index: 10; }
  .panel { width: min(860px, 100%); max-height: 92vh; overflow: auto; background: var(--panel); padding: 24px 28px; border-radius: var(--radius); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .panel h2 { margin: 4px 0 8px; font-size: 18px; }
  .desc { white-space: pre-wrap; background: var(--col); border-radius: 8px; padding: 10px; }
  .comment { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .comment .who { font-weight: 600; } .comment .when { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .comment .body { white-space: pre-wrap; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 10px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.bug { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  button.good { background: var(--done); border-color: var(--done); color: #fff; font-weight: 600; }
  button.warn { background: var(--warn); border-color: var(--warn); color: #fff; font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=checkbox] { width: auto; }
  textarea { resize: vertical; min-height: 70px; }
  label.f { display: block; margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  label.f > :not(span) { margin-top: 3px; font-size: 14px; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; margin-right: 14px; color: var(--text); font-size: 13px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; } .row > * { flex: 1 1 120px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .err { color: var(--danger); margin-top: 8px; font-size: 13px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar h2 { margin: 0 8px 0 0; font-size: 18px; }
  .toolbar .grow { flex: 1; }
  .colbtn { padding: 0 7px; line-height: 20px; font-size: 13px; }
  .overlay.center { align-items: center; justify-content: center; padding: 12px; z-index: 20; }
  .dialog.wide { width: min(900px, 100%); }
  .md table { border-collapse: collapse; margin: 8px 0; } .md td, .md th { border: 1px solid var(--line); padding: 4px 8px; }
  .md pre { background: var(--col); padding: 10px; border-radius: 8px; overflow: auto; } .md code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; margin-top: 18px; } .md h3 { font-size: 15px; }
  .doclist button { display: block; width: 100%; text-align: left; margin: 4px 0; }
  .dialog { width: min(520px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border-radius: var(--radius); padding: 18px; }
  .dialog h2 { margin: 0 0 12px; font-size: 17px; }
  .column.dragover { outline: 2px dashed var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 10%, var(--col)); }
  .card.dragging { opacity: .4; }
  .card[draggable=true] { -webkit-user-drag: element; }
  .verdict { border: 2px solid var(--you); border-radius: var(--radius); padding: 12px; margin: 14px 0; }
  .verdict h3 { margin: 0 0 6px; color: var(--you); }
  .reply { margin-top: 12px; }
  .proj.archived { opacity: .6; }
  .live.paused::before { color: var(--warn); }
  @media (max-width: 760px) {
    .side { grid-template-columns: 1fr; } main { padding: 12px; }
    header { padding: 10px 12px; flex-wrap: wrap; }
    .board { grid-template-columns: repeat(7, 82vw); scroll-snap-type: x proximity; }
    .column { scroll-snap-align: start; }
    .overlay:not(.center) { padding: 0; }
    .panel { padding: 14px; width: 100%; max-height: none; height: 100%; border-radius: 0; }
    input, select, textarea { font-size: 16px; }
    button { padding: 8px 12px; }
    .overlay.center { align-items: flex-end; padding: 0; }
    .dialog { border-radius: var(--radius) var(--radius) 0 0; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="#/">🗂️ AI-gile</a></h1>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <span id="teamTop"></span>
  <span id="inboxTop"></span>
  <a class="navlink" href="#/usage">⚡ Usage</a>
  <span class="live" id="live">live</span>
</header>
<div id="filterbar"></div>
<main id="app"></main>
<div id="modal"></div>
<div id="dialog"></div>
<div id="update"></div>

<script src="usage-page.js"></script>
<script src="inbox.js"></script>
<script>
const COLS = { backlog: 'Backlog', todo: 'To do', doing: 'In progress', review: 'Review', verify: 'For you to test', team: 'For the team', done: 'Done' };
const COL_COLORS = { team: '#e11d74', done: 'var(--done)', verify: 'var(--you)', review: '#0ea5a4', doing: 'var(--accent)', todo: 'var(--warn)' };
const TYPES = ['feature', 'bug', 'task'];
const PRIORITIES = ['low', 'normal', 'high', 'urgent'];
const state = { route: null, projects: [], inbox: [], project: null, openCard: null, showArchived: false, editing: false, dragging: false, lastSig: null };
try { state.showArchived = localStorage.getItem('aigile.showArchived') === '1'; } catch {}

const api = async (method, url, body) => {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = iso => {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago';
};
const $ = id => document.getElementById(id);

function parseRoute() {
  if (location.hash === '#/inbox') return { view: 'inbox' };
  if (/^#\/usage/.test(location.hash)) return { view: 'usage' };
  const m = location.hash.match(/^#\/p\/([^/]+)(?:\/([^/]+))?/);
  return m ? { view: 'project', slug: m[1], card: m[2] || null } : { view: 'home' };
}

// The 1s poll must never wipe out what Rich is typing or a drag in progress.
// busy() = a dialog is open, a card is being edited, a drag is running, a field has focus,
// or any field in the panel holds unsent text. While busy we skip re-rendering (data is re-fetched
// each tick and renders as soon as Rich is done, because the signature differs).
function busy() {
  if (state.dragging || state.editing || $('dialog').firstChild) return true;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('modal').contains(a)) return true;
  return [...document.querySelectorAll('#modal textarea, #modal input[type=text]')].some(el => el.value !== el.defaultValue);
}

async function refresh(force) {
  if (state.route && state.route.view === 'project') state.lastProject = state.route.slug; else if (state.route && state.route.view !== 'inbox') state.lastProject = null;
  state.route = parseRoute();
  if (state.route.view !== 'project') { $('teamTop').innerHTML = ''; $('teamTop').dataset.sig = ''; $('filterbar').innerHTML = ''; $('filterbar').dataset.slug = ''; }
  // The inbox page renders itself; forget the last render so leaving it always redraws.
  if (state.route.view === 'inbox') { state.lastSig = state.lastBoardSig = null; return Inbox.show(force); }
  let sig;
  try {
    if (state.route.view === 'home') {
      const q = state.showArchived ? '?all=1' : '';
      [state.projects, state.inbox, state.usage] = await Promise.all([api('GET', '/api/projects' + q), api('GET', '/api/inbox'), api('GET', '/api/usage').catch(() => ({ enabled: false }))]);
      sig = JSON.stringify([state.route, state.projects, state.inbox, state.usage]);
    } else if (state.route.view === 'usage') {
      await loadUsagePage(force);   // heavy, so at most every ~15s
      sig = JSON.stringify([state.route, uzSig()]);
    } else {
      state.project = await api('GET', '/api/projects/' + state.route.slug);
      await loadDocs(state.route.slug);
      sig = JSON.stringify([state.route, state.project]);
    }
  } catch (e) {
    $('live').className = 'live off';
    $('live').textContent = 'offline: ' + e.message;
    return;
  }
  if (!force && state.dragging) return;
  if (!force && busy()) {
    // Keep the board behind moving; only hold the panel/dialog Rich is using.
    if (sig !== state.lastBoardSig) { state.lastBoardSig = sig; renderBoardOnly(); }
    if (sig !== state.lastSig) { $('live').className = 'live paused'; $('live').textContent = 'live (your typing is safe)'; }
    return;
  }
  $('live').className = 'live';
  $('live').textContent = 'live';
  if (!force && sig === state.lastSig) return;
  state.lastSig = state.lastBoardSig = sig;
  render();
}

function renderBoardOnly() {
  queueMicrotask(paintFilterBar);
  const keepBoardX = document.querySelector('.board')?.scrollLeft || 0;
  if (state.route.view === 'usage') return;
  $('app').innerHTML = state.route.view === 'home' ? renderHome() : renderBoard(state.project);
  const b = document.querySelector('.board'); if (b) b.scrollLeft = keepBoardX;
}

function render() {
  queueMicrotask(paintFilterBar);
  const keepScroll = document.querySelector('#modal .panel')?.scrollTop || 0;
  const keepBoardX = document.querySelector('.board')?.scrollLeft || 0;
  if (state.route.view === 'home') { $('crumb').textContent = ''; $('app').innerHTML = renderHome(); $('modal').innerHTML = ''; return; }
  if (state.route.view === 'usage') { $('crumb').textContent = '/ Usage'; $('app').innerHTML = renderUsagePage(); $('modal').innerHTML = ''; return; }
  const p = state.project;
  $('crumb').textContent = '/ ' + p.name;
  $('app').innerHTML = renderBoard(p);
  const card = state.route.card && p.cards.find(c => c.id === state.route.card);
  if (!card) state.editing = false;
  $('modal').innerHTML = card ? renderCard(p, card) : '';
  const b = document.querySelector('.board'); if (b) b.scrollLeft = keepBoardX;
  const pn = document.querySelector('#modal .panel'); if (pn) pn.scrollTop = keepScroll;
}
const rerender = () => refresh(true);

function bar(counts, total) {
  if (!total) return '<div class="bar"></div>';
  return '<div class="bar">' + ['done', 'verify', 'review', 'doing', 'team', 'todo'].map(s =>
    counts[s] ? `<span title="${COLS[s]}: ${counts[s]}" style="width:${counts[s] / total * 100}%;background:${COL_COLORS[s]}"></span>` : '').join('') + '</div>';
}

// Token usage (this PC). Plan limits aren't in the logs, so these are plain totals for now.
const fmtTok = n => n >= 1e9 ? (n / 1e9).toFixed(1) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
const usageLine = u => `5h ${fmtTok(u.h5)} · today ${fmtTok(u.today)} · 7d ${fmtTok(u.d7)}`;
function usageStrip(u) {
  if (!u?.enabled) return '';
  const total = Object.values(u.org.models7d).reduce((a, b) => a + b, 0) || 1;
  const models = Object.entries(u.org.models7d).filter(([, n]) => n).sort((a, b) => b[1] - a[1]).map(([m, n]) => `${m} ${Math.round(n / total * 100)}%`).join(' · ');
  return `<a class="usage" href="#/usage" title="Open the Usage page"><b>⚡ Usage, all projects (this PC):</b> last 5h <b>${fmtTok(u.org.h5)}</b> · today <b>${fmtTok(u.org.today)}</b> · 7 days <b>${fmtTok(u.org.d7)}</b> · 30 days ${fmtTok(u.org.d30)}
    <span class="muted">· 7-day mix: ${models}${u.other.d7 ? ` · not on the board: ${fmtTok(u.other.d7)} (7d)` : ''}</span>
    <span class="muted"> · <b>See how much you have left →</b></span></a>`;
}

function renderHome() {
  const inbox = state.inbox.length ? `<div class="inbox"><h3>Waiting on you (${state.inbox.length})</h3><ul>${state.inbox.map(c =>
    `<li>${c.status === 'verify' ? '🧪' : '❓'} <a href="#/p/${c.project}/${c.id}"><b>${esc(c.projectName)}</b> · ${esc(c.id)} ${esc(c.title)}</a> <span class="muted">${ago(c.updated)}</span></li>`).join('')}</ul></div>` : '';
  const cards = state.projects.map(p => {
    const active = p.total - p.counts.backlog;
    return `<a class="proj ${p.archived ? 'archived' : ''}" href="#/p/${p.slug}">
      <h2>${esc(p.name)} ${p.archived ? '<span class="pill">archived</span>' : ''} ${p.needsYou ? `<span class="pill you">${p.needsYou} for you</span>` : ''} ${p.blocked ? `<span class="pill blocked">${p.blocked} blocked</span>` : ''}</h2>
      <div class="muted">${esc(p.description)}</div>
      ${bar(p.counts, active)}
      <div class="counts"><b>${Math.round(p.progress * 100)}% done</b>${Object.entries(COLS).map(([k, v]) => `<span>${v} ${p.counts[k]}</span>`).join('')}</div>
      ${p.team.length ? `<div class="last">👥 ${p.team.map(m => esc(m.name)).join(', ')}</div>` : ''}
      <div class="last">${presenceHtml(p, false)}</div>
      ${p.inFlight.length ? `<div class="last">🛠 ${flightHtml(p.inFlight)}</div>` : ''}
      ${state.usage?.enabled && state.usage.projects[p.slug] ? `<div class="last">⚡ ${usageLine(state.usage.projects[p.slug])}</div>` : ''}
      ${p.lastLog ? `<div class="last">📝 ${esc(p.lastLog.text)} · ${ago(p.lastLog.at)}</div>` : ''}
    </a>`;
  }).join('');
  return `<div class="toolbar"><button class="primary" onclick="newProject()">+ New project</button><span class="grow"></span>
      <label class="chk"><input type="checkbox" ${state.showArchived ? 'checked' : ''} onchange="toggleArchived(this.checked)"> Show archived</label></div>`
    + usageStrip(state.usage) + inbox + `<div class="grid">${cards || '<p class="muted">No projects yet.</p>'}</div>`;
}

// "Pixel → AIG-5 (12m ago)". Quiet for 30+ minutes = stale (amber), so stalled agents stand out.
function flightHtml(list) {
  return list.map(c => `<span class="${Date.now() - new Date(c.updated) > 30 * 60e3 ? 'stale' : ''}" title="${esc(c.title)}">${esc(c.assignee || 'unassigned')} → ${esc(c.id)} <span class="muted">(${ago(c.updated)})</span></span>`).join(' · ');
}

// Is the team's session running? (heard from in the last 5 minutes: hooks, wait, status line)
function presenceHtml(p, withWake) {
  const pr = p.presence || {};
  if (pr.online) return `<span class="pres on">🟢 Team online</span> <span class="muted">heard ${ago(pr.lastHeard)}</span>`;
  if (pr.waking) return `<span class="pres wake">⏳ Waking the team…</span> <span class="muted">a terminal window has opened</span>`;
  const btn = withWake && p.path ? ` <button class="primary" onclick="wakeTeam(event)">▶ Wake the team</button>` : withWake ? ` <span class="muted">(connect a folder to wake it)</span>` : '';
  return `<span class="pres off">💤 Team asleep</span>${pr.lastHeard ? ` <span class="muted">last heard ${ago(pr.lastHeard)}</span>` : ''}${btn}`;
}
async function wakeTeam(e) {
  e.preventDefault(); e.stopPropagation();
  const b = e.target; b.disabled = true; b.textContent = 'Opening…';
  try { await api('POST', `/api/projects/${slug()}/wake`); refresh(true); }
  catch (err) { alert(err.message); b.disabled = false; b.textContent = '▶ Wake the team'; }
}

// ---- search / filter (AIG-16): purely in the browser, no extra server calls -----------------------
// The bar lives outside #app so the 1s refresh never wipes what Rich is typing; typing only re-draws the board.
state.filters = {};
const curFilter = slug => state.filters[slug] || (state.filters[slug] = { q: '', type: '', who: '', sprint: '' });
function matchesFilter(c, slug) {
  const f = curFilter(slug);
  if (f.type && c.type !== f.type) return false;
  if (f.who && (c.assignee || '') !== f.who) return false;
  if (f.sprint && (c.sprint || '') !== f.sprint) return false;
  if (f.q) { const q = f.q.toLowerCase(); if (![c.id, c.title, c.description, c.assignee, c.sprint].some(x => String(x || '').toLowerCase().includes(q))) return false; }
  return true;
}
function paintFilterBar() {
  const bar = $('filterbar');
  if (state.route.view !== 'project' || !state.project) { if (bar.innerHTML) { bar.innerHTML = ''; bar.dataset.slug = ''; } return; }
  const p = state.project, f = curFilter(p.slug);
  const uniq = key => [...new Set(p.cards.map(c => c[key]).filter(Boolean))].sort();
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;
  const sel = (key, all, list) => `<select data-f="${key}">${opt('', all, f[key])}${list.map(v => opt(v, v, f[key])).join('')}</select>`;
  const shown = p.cards.filter(c => matchesFilter(c, p.slug)).length, active = f.q || f.type || f.who || f.sprint;
  const selects = sel('type', 'All types', ['feature', 'bug', 'task']) + sel('who', 'Anyone', uniq('assignee')) + sel('sprint', 'All sprints', uniq('sprint'));
  if (bar.dataset.slug !== p.slug) {   // build once per project; afterwards only the selects and count update
    bar.dataset.slug = p.slug;
    bar.innerHTML = `<div class="fbar"><input type="search" id="f-q" placeholder="🔍 Search cards…" value="${esc(f.q)}" oninput="setFilter('q', this.value)">
      <span id="f-sel">${selects}</span><span id="f-count" class="muted"></span></div>`;
    bar.querySelector('#f-sel').onchange = e => setFilter(e.target.dataset.f, e.target.value);
  } else if ($('f-sel').dataset.sig !== selects && !$('f-sel').contains(document.activeElement)) { $('f-sel').innerHTML = selects; }
  $('f-sel').dataset.sig = selects;
  $('f-count').innerHTML = active ? `Showing <b>${shown}</b> of ${p.cards.length} · <a href="#" onclick="clearFilter();return false">clear</a>` : '';
}
function setFilter(key, v) { curFilter(state.project.slug)[key] = v; renderBoardOnly(); paintFilterBar(); }
function clearFilter() { state.filters[state.project.slug] = null; $('filterbar').dataset.slug = ''; renderBoardOnly(); paintFilterBar(); }

function renderBoard(p) {
  // Team status lives in the top-right corner, next to the inbox (where Rich looks for notifications).
  const tt = $('teamTop'); const th = presenceHtml(p, true); if (tt.dataset.sig !== th) { tt.dataset.sig = th; tt.innerHTML = th; }
  const cols = Object.entries(COLS).map(([k, label]) => {
    // 'For you to test' is a queue: longest-waiting first, so 'Wait and see' sends a card to the back.
    const cs = p.cards.filter(c => c.status === k && matchesFilter(c, p.slug)).sort((a, b) => k === 'verify' ? a.updated.localeCompare(b.updated) : b.updated.localeCompare(a.updated));
    return `<div class="column" data-status="${k}"><h3><span>${label}</span><span>${cs.length} <button class="colbtn" title="New card in ${esc(label)}" onclick="newCard({status:'${k}'})">+</button></span></h3>${cs.map(cardHtml).join('')}</div>`;
  }).join('');
  const team = (p.team || []).filter(m => !/retired/i.test(m.status || ''));
  const log = (p.log || []).slice().reverse().slice(0, 50);
  return `<div class="toolbar"><h2>${esc(p.name)}${p.archived ? ' <span class="pill">archived</span>' : ''}</h2>
      <button class="primary" onclick="newCard()">+ New</button>
      <button onclick="openDocs()">📄 Docs</button>
      <button class="bug" onclick="newCard({type:'bug',priority:'high',status:'team'})">🐞 Raise bug</button>
      <span class="grow"></span>
      <button onclick="connectDialog()" title="${p.path ? 'Connected to ' + esc(p.path) : 'Set this project up in a folder so its team uses the board'}">🔌 ${p.path ? 'Folder connected' : 'Connect folder'}</button>
      <button onclick="${p.archived ? 'setArchived(false)' : 'setArchived(true)'}">${p.archived ? '📤 Unarchive project' : '📦 Archive project'}</button></div>
    <div class="flight">🛠 <b>In flight:</b> ${flightHtml(p.cards.filter(c => c.status === 'doing').sort((a, b) => b.updated.localeCompare(a.updated))) || '<span class="muted">nothing right now</span>'}</div>
    ${p.description || p.path ? `<p class="muted" style="margin-top:-6px">${esc(p.description)}${p.path ? ` <code>${esc(p.path)}</code>` : ''}</p>` : ''}
    <div class="board">${cols}</div>
    <div class="side">
      <div class="box"><h3>Team</h3>${team.length ? `<table><tr><th>Member</th><th>Role</th><th>Working on</th><th>Status</th></tr>${team.map(m =>
        `<tr><td><b>${esc(m.name)}</b> <span class="muted">${esc(m.model)}</span></td><td>${esc(m.role)}</td><td>${esc(m.task)}</td><td>${esc(m.status)}</td></tr>`).join('')}</table>` : '<p class="muted">No team members yet.</p>'}</div>
      <div class="box"><h3>Log &amp; decisions</h3>${log.length ? `<ul class="log">${log.map(l =>
        `<li class="${l.kind}">${l.kind === 'decision' ? '⚖️ ' : ''}<b>${esc(l.author)}</b>: ${esc(l.text)} <span class="muted">${ago(l.at)}</span></li>`).join('')}</ul>` : '<p class="muted">Nothing logged yet.</p>'}</div>
    </div>`;
}

function metaHtml(c) {
  return `<span class="pill">${esc(c.type)}</span>
      ${c.priority !== 'normal' ? `<span class="pill ${c.priority}">${esc(c.priority)}</span>` : ''}
      ${c.assignee ? `<span class="pill">👤 ${esc(c.assignee)}</span>` : ''}
      ${c.needsYou && c.status !== 'done' ? '<span class="pill you">needs you</span>' : ''}
      ${c.blocked ? '<span class="pill blocked">blocked</span>' : ''}
      ${c.comments.length ? `<span class="pill">💬 ${c.comments.length}</span>` : ''}`;
}

// Last time the team said or did something on a card (Rich's own comments and pokes don't count).
const STALE_MS = 30 * 60e3;
function lastHeard(c) {
  const m = [...c.comments].reverse().find(m => m.author.toLowerCase() !== 'rich');
  return m ? { who: m.author, at: m.at, text: m.text } : { who: c.assignee || 'team', at: c.created, text: '' };
}
function cardHtml(c) {
  const live = ['doing', 'review'].includes(c.status), heard = live && lastHeard(c);
  const stale = live && Date.now() - new Date(heard.at) > STALE_MS;
  const cls = [stale ? 'stale-card' : '', 'card', (c.needsYou && c.status !== 'done') || c.status === 'verify' ? 'needs-you' : '', c.blocked ? 'is-blocked' : ''].join(' ');
  return `<a class="${cls}" href="#/p/${state.project.slug}/${c.id}" data-id="${c.id}" draggable="true" style="display:block">
    <div class="id">${esc(c.id)}${c.sprint ? ' · ' + esc(c.sprint) : ''}</div>
    <div class="t">${esc(c.title)}</div>
    ${live ? `<div class="heard">💬 ${esc(heard.who)} ${ago(heard.at)}${heard.text ? ': ' + esc(heard.text.slice(0, 60).replace(/\n/g, ' ')) : ''}</div>` : ''}
    <div class="meta">${metaHtml(c)}${live ? `<button class="poke${stale ? ' hot' : ''}" title="Nudge the team: any update?" onclick="event.preventDefault();event.stopPropagation();poke('${c.id}')">👉 Poke</button>` : ''}</div></a>`;
}
async function poke(id) {
  try { await api('POST', `/api/projects/${slug()}/cards/${id}/poke`); refresh(true); } catch (e) { alert(e.message); }
}

const opts = (list, cur, labels) => list.map(v => `<option value="${v}" ${v === cur ? 'selected' : ''}>${esc(labels ? labels[v] : v)}</option>`).join('');

function cardFields(c, o = {}) {
  return `<label class="f"><span>Title</span><input type="text" id="f-title" value="${esc(c.title)}" placeholder="${esc(o.titlePh || '')}" maxlength="200"></label>
    <label class="f"><span>${esc(o.descLabel || 'Description')}</span><textarea id="f-description" rows="4" placeholder="${esc(o.descPh || '')}">${esc(c.description)}</textarea></label>
    ${o.testSteps ? `<label class="f"><span>Test steps</span><textarea id="f-testSteps" rows="4">${esc(c.testSteps)}</textarea></label>` : ''}
    <div class="row">
      <label class="f"><span>Type</span><select id="f-type">${opts(TYPES, c.type)}</select></label>
      <label class="f"><span>Priority</span><select id="f-priority">${opts(PRIORITIES, c.priority)}</select></label>
      <label class="f"><span>Status</span><select id="f-status">${opts(Object.keys(COLS), c.status, COLS)}</select></label>
    </div>
    <div class="row">
      <label class="f"><span>Assignee</span>${assigneeSelect(c.assignee || '')}</label>
      <label class="f"><span>Sprint</span><input type="text" id="f-sprint" value="${esc(c.sprint)}"></label>
    </div>
    ${o.flags ? `<div><label class="chk"><input type="checkbox" id="f-blocked" ${c.blocked ? 'checked' : ''}> Blocked</label>
      <label class="chk"><input type="checkbox" id="f-needsYou" ${c.needsYou ? 'checked' : ''}> Needs you</label></div>` : ''}`;
}
// Who a card goes to: a role (the lead launches that kind of agent; the model is shown so the cost is
// visible), a named team member, or Rich himself (a task for him). Agents swap a role for their name on start.
const ROLES = [
  ['Lead (Opus)', '🧠', 'planning, specs, tricky decisions'],
  ['Reviewer (Opus)', '🔍', 'audits, code review, security'],
  ['Frontend (Sonnet)', '🎨', 'pages, UI, styling'],
  ['Backend (Sonnet)', '⚙️', 'servers, data, APIs'],
  ['QA (Haiku)', '🧪', 'test runs, browser checks'],
  ['Quick fix (Haiku)', '🔧', 'small, clear changes, cheapest'],
  ['Docs (Haiku)', '📄', 'READMEs, guides'],
];
function assigneeSelect(cur) {
  const team = (state.project?.team || []).filter(m => !/retired/i.test(m.status || '') && m.name !== 'Rich').map(m => m.name);
  const known = new Set(['', 'Rich', ...ROLES.map(r => r[0]), ...team]);
  const o = (v, label) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;
  return `<select id="f-assignee" onchange="onAssignee(this)">
    ${o('', '— nobody yet —')}${cur && !known.has(cur) ? o(cur, '👤 ' + cur) : ''}
    <optgroup label="Roles: the lead launches this kind of agent">${ROLES.map(([v, i, t]) => o(v, `${i} ${v}: ${t}`)).join('')}</optgroup>
    ${team.length ? `<optgroup label="Team members">${team.map(n => o(n, '👤 ' + n)).join('')}</optgroup>` : ''}
    <optgroup label="You">${o('Rich', '🙋 Rich: a task for you')}</optgroup>
    <option value="__other">✏️ Someone else…</option></select>`;
}
function onAssignee(sel) {
  if (sel.value !== '__other') return;
  const v = (prompt('Assign to who?') || '').trim();
  if (!v) { sel.value = ''; return; }
  sel.add(new Option('👤 ' + v, v, true, true), sel.options[1]);
}

function readFields(flags, testSteps) {
  const o = { title: $('f-title').value.trim(), description: $('f-description').value, type: $('f-type').value, priority: $('f-priority').value,
    status: $('f-status').value, assignee: $('f-assignee').value.trim(), sprint: $('f-sprint').value.trim() };
  if (testSteps) o.testSteps = $('f-testSteps').value;
  if (flags) { o.blocked = $('f-blocked').checked; o.needsYou = $('f-needsYou').checked; }
  return o;
}

// The project's .md files, fetched once per project, so file names in cards can open them.
async function loadDocs(s) {
  if (state.docsFor === s) return;
  state.docsFor = s;
  try { state.docs = await api('GET', `/api/projects/${s}/docs`); } catch { state.docs = []; }
}

// Escape, then make web links, this project's card ids (e.g. AIG-12) and its .md files clickable.
// Card text: ```fenced``` blocks become code boxes with a Copy button, `inline` becomes code,
// everything else goes through fmt (escape + links). Also used by inbox.js.
function withCode(text, fmt) {
  return String(text ?? '').split(/```[^\n]*\n?([\s\S]*?)```/g).map((part, i) => i % 2
    ? `<div class="codebox"><button class="copy" onclick="copyCode(this)">📋 Copy</button><pre><code>${esc(part.replace(/\n$/, ''))}</code></pre></div>`
    : spaceBullets(fmt(i ? part.replace(/^\n/, '') : part).replace(/`([^`\n]+)`/g, '<code>$1</code>'))).join('');
}
// Runs of "- " lines become a spaced bullet list, so cards stay readable whoever wrote them.
function spaceBullets(html) {
  return html.replace(/(^|\n)((?:[ \t]*[-•][ \t]+[^\n]*(?:\n[ \t]*\n?|$))+)/g, (m, pre, block) =>
    pre + '<ul class="bl">' + block.split('\n').filter(l => l.trim()).map(l => `<li>${l.replace(/^[ \t]*[-•][ \t]+/, '')}</li>`).join('') + '</ul>');
}
function copyCode(btn) {
  navigator.clipboard.writeText(btn.nextElementSibling.textContent)
    .then(() => { btn.textContent = '✅ Copied'; setTimeout(() => { btn.textContent = '📋 Copy'; }, 1500); });
}
function linkify(text, p) { return withCode(text, t => linkifyText(t, p)); }
function linkifyText(text, p) {
  const docs = state.docsFor === p.slug ? state.docs || [] : [];
  const docIndex = name => { const n = name.toLowerCase(); return docs.findIndex(d => d.toLowerCase() === n || d.toLowerCase().split('/').pop() === n); };
  return linkifyBase(text, p).replace(/(^|[\s(>"'`])((?:[\w.-]+\/)*[\w.-]+\.md)\b/gi, (m, pre, name) => {
    const i = docIndex(name);
    return i < 0 ? m : `${pre}<a href="#" onclick="showDoc(${i});return false" title="Open ${esc(docs[i])}">${name}</a>`;
  });
}
function linkifyBase(text, p) {
  const key = String(p.key).replace(/[^A-Za-z0-9]/g, '');
  return esc(text)
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')   // **bold**, used in bullet-point cards
    .replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)\]]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
    .replace(new RegExp(`(^|[^\\w/#-])(${key}-\\d+)\\b`, 'gi'), (m, pre, id) => `${pre}<a href="#/p/${p.slug}/${id.toUpperCase()}">${id}</a>`);
}

function renderCard(p, c) {
  const close = `location.hash='#/p/${p.slug}'`;
  const head = `<div class="actions" style="margin-top:0"><button onclick="${close}">✕ Close</button><span style="flex:1"></span>
      ${state.editing ? '' : '<button onclick="editCard()">✏️ Edit</button> <button class="danger" onclick="deleteCard()">🗑 Delete</button>'}</div>`;
  if (state.editing) {
    return `<div class="overlay"><div class="panel">${head}
      <div class="id muted" style="margin-top:12px">${esc(c.id)} · editing</div>
      <form onsubmit="return saveCard(event)" style="margin-top:8px">${cardFields(c, { testSteps: true, flags: true })}
        <div class="err" id="f-err"></div>
        <div class="actions"><button class="primary" type="submit">Save</button><button type="button" onclick="cancelEdit()">Cancel</button>
        <span style="flex:1"></span><button type="button" class="danger" onclick="deleteCard()">🗑 Delete</button></div></form>
    </div></div>`;
  }
  const verdict = c.status === 'verify' ? `<div class="verdict"><h3>🧪 Your call</h3>
      <div class="muted">Built and waiting for you to test${c.testSteps ? ' (steps below)' : ''}.</div>
      <label class="f" style="margin-top:8px"><span>Comment (required to send back)</span><textarea id="v-text" rows="3" placeholder="What did you see? What's wrong?"></textarea></label>
      <div class="err" id="v-err"></div>
      <div class="actions"><button class="good" onclick="verdict(true)">✅ Accept</button><button class="warn" onclick="verdict(false)">🔁 Send back</button><button onclick="waitAndSee()" title="Not sure yet: move it to the back of your queue">⏳ Wait and see</button></div></div>` : '';
  // Tabs: Reply (latest message on top, reply box right under it, older ones below), Details, Test.
  const msg = (m, latest) => `<div class="comment${latest ? ' latest' : ''}">${latest ? '<span class="tag-latest">Latest</span>' : ''}<span class="who">${esc(m.author)}</span><span class="when">${ago(m.at)}</span>${m.author.toLowerCase() === 'rich' ? (p.teamSeenAt && m.at <= p.teamSeenAt ? '<span class="seen">✓ seen by team</span>' : '<span class="seen">⏳ not seen yet</span>') : ''}<div class="body">${linkify(m.text, p)}</div></div>`;
  const newest = [...c.comments].reverse();
  const hasTest = c.status === 'verify' || c.testSteps;
  if (state.tabFor !== c.id) { state.tabFor = c.id; state.cardTab = c.status === 'verify' ? 'test' : c.comments.length ? 'reply' : 'details'; }
  const tab = state.cardTab === 'test' && !hasTest ? 'reply' : state.cardTab;
  const tabBtn = (k, label) => `<button class="ctab ${tab === k ? 'on' : ''}" data-ctab="${k}" onclick="cardTab('${k}')">${label}</button>`;
  return `<div class="overlay" onclick="if(event.target===this) ${close}"><div class="panel">${head}
    <div class="id muted" style="margin-top:12px">${esc(c.id)} · ${esc(COLS[c.status])}${c.status === 'team' && c.prevStatus ? ' (was ' + esc(COLS[c.prevStatus]) + ')' : ''}${c.sprint ? ' · ' + esc(c.sprint) : ''}</div>
    <h2>${esc(c.title)}</h2>
    <div class="meta">${metaHtml(c)}</div>
    <div class="ctabs">${tabBtn('reply', `💬 Reply${c.comments.length ? ` <span class="n">${c.comments.length}</span>` : ''}`)}${tabBtn('details', '📄 Details')}${hasTest ? tabBtn('test', c.status === 'verify' ? '🧪 Test <span class="n hot">your call</span>' : '🧪 Test') : ''}</div>
    <div class="cpane" data-pane="reply" ${tab === 'reply' ? '' : 'hidden'}>
      ${newest.length ? msg(newest[0], true) : '<p class="muted">No messages yet.</p>'}
      <div class="reply"><textarea id="r-text" rows="3" placeholder="Reply as Rich: moves the card to For the team… (Enter to send, Shift+Enter for a new line)" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendReply()}"></textarea>
        <div class="err" id="r-err"></div>
        <div class="actions"><button class="primary" onclick="sendReply()">Send reply</button></div></div>
      ${newest.length > 1 ? `<h3 class="muted" style="font-size:13px;margin-top:18px">Earlier (newest first)</h3>${newest.slice(1).map(m => msg(m, false)).join('')}` : ''}
    </div>
    <div class="cpane" data-pane="details" ${tab === 'details' ? '' : 'hidden'}>
      ${c.description ? `<div class="desc">${linkify(c.description, p)}</div>` : '<p class="muted">No description.</p>'}
    </div>
    ${hasTest ? `<div class="cpane" data-pane="test" ${tab === 'test' ? '' : 'hidden'}>${verdict}
      ${c.testSteps ? `<h3>🧪 How to test</h3><div class="desc">${linkify(c.testSteps, p)}</div>` : ''}</div>` : ''}
  </div></div>`;
}
// Switch card tab without re-rendering, so anything typed in another tab is kept.
function cardTab(k) {
  state.cardTab = k;
  document.querySelectorAll('#modal .ctab').forEach(b => b.classList.toggle('on', b.dataset.ctab === k));
  document.querySelectorAll('#modal .cpane').forEach(d => { d.hidden = d.dataset.pane !== k; });
}

// ---- actions -------------------------------------------------------------------
const slug = () => state.route.slug;
const cardId = () => state.route.card;
const curCard = () => state.project.cards.find(c => c.id === cardId());
const setErr = (id, e) => { const el = $(id); if (el) el.textContent = e ? (e.message || e) : ''; };

function openDialog(html, cls = '') {
  $('dialog').innerHTML = `<div class="overlay center"><div class="dialog ${cls}">${html}</div></div>`;
  const f = $('dialog').querySelector('input[type=text]'); if (f) f.focus();
}
function closeDialog() { $('dialog').innerHTML = ''; }

// ---- connect a folder: sets the project's folder up so its team uses the board and the ways of working ----
async function connectDialog() {
  const p = state.project;
  let suggest = p.path;
  if (!suggest) { try { const m = await api('GET', '/api/meta'); suggest = m.home + '\\' + p.name.replace(/[<>:"/\\|?*]/g, '').trim(); } catch { suggest = ''; } }
  openDialog(`<h2>🔌 ${p.path ? 'Folder connected' : 'Connect a folder'}</h2>
    <p class="muted">The team working in this folder will then use this board and your ways of working. It adds two local files there (notes and hooks) that git won't see. Safe to run again.</p>
    <label class="f"><span>Folder</span><input type="text" id="c-path" value="${esc(suggest)}"></label>
    <label class="chk"><input type="checkbox" id="c-create" checked> Create the folder if it doesn't exist</label>
    <div class="err" id="c-err"></div><div id="c-done"></div>
    <div class="actions"><button class="primary" id="c-go" onclick="doConnect()">${p.path ? 'Reconnect' : 'Connect'}</button><button type="button" onclick="closeDialog()">Close</button></div>`);
}
async function doConnect() {
  try {
    const r = await api('POST', `/api/projects/${slug()}/connect`, { path: $('c-path').value, create: $('c-create').checked });
    $('c-err').textContent = '';
    $('c-done').innerHTML = `<ul>${r.done.map(d => `<li>✅ ${esc(d)}</li>`).join('')}</ul><p><b>Next:</b> start a new session in that folder. It will read the board and your ways of working by itself.</p>`;
    $('c-go').remove();
  } catch (e) { setErr('c-err', e); }
}

// ---- docs: read a project's .md files in the board -----------------------------
async function openDocs() {
  try {
    state.docs = await api('GET', `/api/projects/${slug()}/docs`);
    openDialog(`<h2>📄 Docs</h2>${state.docs.length ? `<div class="doclist">${state.docs.map((n, i) => `<button onclick="showDoc(${i})">${esc(n)}</button>`).join('')}</div>`
      : `<p class="muted">No .md files found${state.project.path ? ' in ' + esc(state.project.path) : ': this project has no folder path set'}.</p>`}
      <div class="actions"><button onclick="closeDialog()">Close</button></div>`);
  } catch (e) { alert(e.message); }
}
async function showDoc(i) {
  try {
    const d = await api('GET', `/api/projects/${slug()}/docs/${encodeURIComponent(state.docs[i])}`);
    openDialog(`<div class="actions" style="margin-top:0"><button onclick="openDocs()">← Docs</button><button onclick="closeDialog()">Close</button></div>
      <div class="md">${md(d.text)}</div>`, 'wide');
  } catch (e) { alert(e.message); }
}
// Small markdown renderer: headings, lists, tables, code blocks, links, bold/italic/code.
function md(src) {
  const lines = src.replace(/\r/g, '').split('\n'); let html = '', i = 0;
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^https?:/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t);
  const isList = l => /^\s*([-*]|\d+\.)\s+/.test(l), isRow = l => /^\s*\|/.test(l);
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (/^```/.test(l)) { const b = []; i++; while (i < lines.length && !/^```/.test(lines[i])) b.push(lines[i++]); i++; html += `<pre><code>${esc(b.join('\n'))}</code></pre>`; }
    else if ((m = l.match(/^(#{1,6})\s+(.*)/))) { html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; }
    else if (isRow(l)) {
      const rows = []; while (i < lines.length && isRow(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(c => inline(c.trim().replace(/\\\|/g, '|')));
      html += '<table>' + rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map((r, k) => '<tr>' + cells(r).map(c => k ? `<td>${c}</td>` : `<th>${c}</th>`).join('') + '</tr>').join('') + '</table>';
    }
    else if (isList(l)) {
      const ol = /^\s*\d+\./.test(l), items = []; while (i < lines.length && isList(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''));
      html += `<${ol ? 'ol' : 'ul'}>${items.map(t => `<li>${inline(t)}</li>`).join('')}</${ol ? 'ol' : 'ul'}>`;
    }
    else if (/^---+\s*$/.test(l)) { html += '<hr>'; i++; }
    else if (!l.trim()) i++;
    else {
      const p = [lines[i++]]; while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|---+\s*$)/.test(lines[i]) && !isRow(lines[i]) && !isList(lines[i])) p.push(lines[i++]);
      html += `<p>${inline(p.join(' '))}</p>`;
    }
  }
  return html;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('dialog').firstChild) closeDialog(); });

function newCard(preset = {}) {
  const bug = preset.type === 'bug';
  // Rich's new cards go straight to the team (AIG-51); the + on a column still picks that column.
  const c = { title: '', description: '', testSteps: '', type: 'feature', priority: 'normal', status: 'team', assignee: '', sprint: '', ...preset };
  openDialog(`<h2>${bug ? '🐞 Raise bug' : 'New card'}</h2>
    <form onsubmit="return createCard(event)">${cardFields(c, bug ? { titlePh: "What's broken?", descLabel: 'What happened / how to reproduce', descPh: 'Steps, what you expected, what you saw' } : { titlePh: 'What needs doing?' })}
      <div class="err" id="d-err"></div>
      <div class="actions"><button class="${bug ? 'bug' : 'primary'}" type="submit">${bug ? 'Raise bug' : 'Create card'}</button><button type="button" onclick="closeDialog()">Cancel</button></div></form>`);
}
async function createCard(e) {
  e.preventDefault();
  const body = readFields(false, false);
  if (!body.title) { setErr('d-err', 'Give it a title'); return false; }
  try {
    const c = await api('POST', `/api/projects/${slug()}/cards`, { ...body, createdBy: 'Rich' });
    closeDialog();
    await rerender();
  } catch (err) { setErr('d-err', err); }
  return false;
}

function editCard() { state.editing = true; render(); const t = $('f-title'); if (t) t.focus(); }
function cancelEdit() { state.editing = false; rerender(); }
async function saveCard(e) {
  e.preventDefault();
  const c = curCard(), now = readFields(true, true), body = {};
  if (!now.title) { setErr('f-err', 'Title cannot be empty'); return false; }
  for (const k in now) if (now[k] !== c[k]) body[k] = now[k];
  try {
    if (Object.keys(body).length) await api('PATCH', `/api/projects/${slug()}/cards/${c.id}`, body);
    state.editing = false;
    await rerender();
  } catch (err) { setErr('f-err', err); }
  return false;
}
async function deleteCard() {
  const c = curCard();
  if (!confirm(`Delete ${c.id} "${c.title}"? This cannot be undone.`)) return;
  try {
    await api('DELETE', `/api/projects/${slug()}/cards/${c.id}`);
    state.editing = false;
    location.hash = '#/p/' + slug();
  } catch (err) { alert(err.message); }
}

// Once Rich has replied or given a verdict he's done with the card: close the panel, back to the board.
function closeCard() {
  state.editing = false;
  $('modal').innerHTML = '';
  location.hash = '#/p/' + slug();
}
async function sendReply() {
  const t = $('r-text').value.trim();
  if (!t) { setErr('r-err', 'Write something first'); return; }
  try {
    await api('POST', `/api/projects/${slug()}/cards/${cardId()}/comments`, { author: 'Rich', text: t });
    closeCard();
  } catch (err) { setErr('r-err', err); }
}
async function waitAndSee() {
  try { await api('PATCH', `/api/projects/${slug()}/cards/${cardId()}`, {}); closeCard(); } catch (err) { setErr('v-err', err); }
}
async function verdict(accept) {
  const t = $('v-text').value.trim();
  if (!accept && !t) { setErr('v-err', 'Say what is wrong before sending it back'); $('v-text').focus(); return; }
  try {
    await api('POST', `/api/projects/${slug()}/cards/${cardId()}/verdict`, { accept, text: t });
    closeCard();
  } catch (err) { setErr('v-err', err); }
}

// ---- projects ------------------------------------------------------------------
function newProject() {
  openDialog(`<h2>New project</h2>
    <form onsubmit="return createProject(event)">
      <label class="f"><span>Name</span><input type="text" id="p-name" oninput="suggestKey()" maxlength="80"></label>
      <div class="row"><label class="f"><span>Key (card prefix, e.g. AIG)</span><input type="text" id="p-key" maxlength="6" oninput="this.dataset.touched=1"></label></div>
      <label class="f"><span>Folder path (optional)</span><input type="text" id="p-path" placeholder="C:\\Users\\rich\\Desktop\\..."></label>
      <label class="f"><span>Description (optional)</span><textarea id="p-desc" rows="3"></textarea></label>
      <div class="err" id="d-err"></div>
      <div class="actions"><button class="primary" type="submit">Create project</button><button type="button" onclick="closeDialog()">Cancel</button></div></form>`);
}
function suggestKey() {
  const k = $('p-key'); if (k.dataset.touched) return;
  k.value = $('p-name').value.replace(/[^A-Za-z0-9]/g, '').slice(0, 3).toUpperCase();
}
async function createProject(e) {
  e.preventDefault();
  const name = $('p-name').value.trim();
  if (!name) { setErr('d-err', 'Give the project a name'); return false; }
  try {
    const p = await api('POST', '/api/projects', { name, key: $('p-key').value.trim(), path: $('p-path').value.trim(), description: $('p-desc').value.trim() });
    closeDialog();
    location.hash = '#/p/' + p.slug;
  } catch (err) { setErr('d-err', err); }
  return false;
}
async function setArchived(on) {
  if (on && !confirm('Archive this project? It will be hidden from the home page (you can show archived projects there and unarchive).')) return;
  try {
    await api('PATCH', '/api/projects/' + slug(), { archived: on });
    if (on) location.hash = '#/'; else await rerender();
  } catch (err) { alert(err.message); }
}
function toggleArchived(on) {
  state.showArchived = on;
  try { localStorage.setItem('aigile.showArchived', on ? '1' : '0'); } catch {}
  rerender();
}

// ---- drag and drop (native HTML5) ----------------------------------------------
const app = $('app');
app.addEventListener('dragstart', e => {
  const el = e.target.closest?.('.card'); if (!el) return;
  state.dragging = true;
  e.dataTransfer.setData('text/plain', el.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  el.classList.add('dragging');
});
app.addEventListener('dragend', () => {
  state.dragging = false;
  document.querySelectorAll('.dragging, .dragover').forEach(x => x.classList.remove('dragging', 'dragover'));
  refresh();
});
app.addEventListener('dragover', e => {
  const col = e.target.closest?.('.column'); if (!col || !state.dragging) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.dragover').forEach(x => x !== col && x.classList.remove('dragover'));
  col.classList.add('dragover');
});
app.addEventListener('drop', async e => {
  const col = e.target.closest?.('.column'); if (!col || !state.dragging) return;
  e.preventDefault();
  const id = e.dataTransfer.getData('text/plain'), status = col.dataset.status;
  state.dragging = false;
  document.querySelectorAll('.dragging, .dragover').forEach(x => x.classList.remove('dragging', 'dragover'));
  const c = state.project.cards.find(c => c.id === id);
  if (!c || c.status === status) return;
  c.status = status; c.updated = new Date().toISOString(); render();   // optimistic
  try { await api('PATCH', `/api/projects/${slug()}/cards/${id}`, { status }); }
  catch (err) { alert('Could not move card: ' + err.message); }
  rerender();
});

window.addEventListener('hashchange', () => { state.editing = false; refresh(true); });
refresh(true);
setInterval(() => { if (!document.hidden) refresh(); }, 1000);

// Dev builds: when the server or page changes, prompt Rich to refresh instead of running stale code.
let loadedBuild = null;
async function checkBuild() {
  try {
    const m = await api('GET', '/api/meta');
    if (loadedBuild === null) { loadedBuild = m.build; return; }
    if (m.dev && m.build !== loadedBuild && !$('update').firstChild)
      $('update').innerHTML = `<div class="overlay center" style="z-index:50"><div class="dialog">
        <h2>🆕 New version available</h2><p>The board has been updated. Refresh to get the latest version.</p>
        <div class="actions"><button class="primary" onclick="location.reload()">Refresh now</button>
        <button onclick="$('update').innerHTML=''; loadedBuild=null">Later</button></div></div></div>`;
  } catch {}
}
checkBuild();
setInterval(checkBuild, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
